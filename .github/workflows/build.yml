name: Build MCX19Hook APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android command-line-tools
        run: |
          set -e
          mkdir -p ~/android-sdk/cmdline-tools
          cd ~/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d tmpdir
          mv tmpdir/cmdline-tools ./cmdline-tools/latest
          rm -rf tmpdir commandlinetools-linux-11076708_latest.zip

          export ANDROID_HOME=~/android-sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

          timeout 20 yes | sdkmanager --sdk_root="${ANDROID_HOME}" --licenses || true

          sdkmanager --sdk_root="${ANDROID_HOME}" "platforms;android-34"
          sdkmanager --sdk_root="${ANDROID_HOME}" "build-tools;34.0.0"
          sdkmanager --sdk_root="${ANDROID_HOME}" "ndk;27.0.12077973"
          sdkmanager --sdk_root="${ANDROID_HOME}" "platform-tools"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android
            ~/android-sdk
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Verify LSPosed JAR
        run: ls -la app/libs/lsposed-api-1.9.2.jar

      - name: Setup Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Setup Gradle Wrapper
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon -x lint
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MCX19Hook-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7