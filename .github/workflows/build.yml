name: Build MCX19Hook APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        ndk-version: r27c
        build-tools-version: 34.0.0
    
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Download LSPosed API (Primary)
      run: |
        mkdir -p app/libs
        curl -L -o app/libs/lsposed-api-1.9.2.jar \
          "https://github.com/LSPosed/LSPosed/releases/download/v1.9.2/lsposed-api-1.9.2.jar" \
          || echo "Primary download failed, trying JitPack..."
    
    - name: Download LSPosed API (Fallback JitPack)
      if: ${{ !fileExists('app/libs/lsposed-api-1.9.2.jar') }}
      run: |
        mkdir -p app/libs
        curl -L -o app/libs/lsposed-api-1.9.2.jar \
          "https://jitpack.io/com/github/LSPosed/LSPosed/lsposed-api/1.9.2/lsposed-api-1.9.2.jar"
    
    - name: Setup Keystore
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    
    - name: Generate Gradle Wrapper
      run: |
        chmod +x gradlew 2>/dev/null || true
        ./gradlew wrapper --gradle-version 8.5 --distribution-type bin
        chmod +x gradlew
    
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon -x lint
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    
    - name: Upload APK
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: MCX19Hook-APK
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 7
